<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">⚙ AdminPanel</span>
    </div>

    <nav class="sidebar-nav">
      @if (showUsers()) {
        <a routerLink="/users" routerLinkActive="active" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Users
        </a>
      }
      @if (showProducts()) {
        <a routerLink="/products" routerLinkActive="active" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Products
        </a>
      }
      @if (showDistributors()) {
        <a routerLink="/distributors" routerLinkActive="active" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          Distributors
        </a>
      }
      @if (showStores()) {
        <a routerLink="/stores" routerLinkActive="active" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Stores
        </a>
      }
      @if (showSuppliers()) {
        <a routerLink="/suppliers" routerLinkActive="active" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          Suppliers
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      @if (user()) {
        <div class="user-info">
          <div class="user-avatar">{{ user()!.email[0].toUpperCase() }}</div>
          <div class="user-details">
            <span class="user-email">{{ user()!.email }}</span>
            <span class="user-role">{{ user()!.role }}</span>
          </div>
        </div>
      }
      <button class="btn-logout" (click)="logout()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet />
  </main>
</div>
